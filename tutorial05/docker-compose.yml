services:
  # Servicio de Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    volumes:
      # Persistencia: los datos sobreviven si apagas el contenedor
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    # Healthcheck: permite que 'web' espere a que Postgres acepte conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio de tu API Django (ahora servido por Gunicorn)
  web:
    build: .
    # CAMBIO 1: migramos, cargamos datos y arrancamos con GUNICORN (no runserver).
    # 'Tienda' es la carpeta del proyecto que contiene wsgi.py (Tienda/wsgi.py).
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_datos &&
             gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # NOTA: Ya NO hay sección 'ports' aquí. Django queda aislado del exterior;
    # solo Nginx puede hablar con él en la red interna de Docker.

  # CAMBIO 2: servicio Nginx (proxy inverso) — único que da la cara a internet
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      # Inyectamos nuestra configuración dentro del contenedor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

# Definición del volumen persistente
volumes:
  postgres_data:
