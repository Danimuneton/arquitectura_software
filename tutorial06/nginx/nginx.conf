# nginx/nginx.conf — El cerebro del ruteo (Strangler Pattern)

# Backend v1: el monolito Django (servido por Gunicorn)
upstream django_v1 {
    server web_django:8000;
}

# Backend v2: el microservicio Flask (el "estrangulador")
upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA NUEVA (v2): estrangulamos la función de compra -> Flask.
    # Debe ir ANTES del bloque /api/v1/ para que Nginx la evalúe con prioridad.
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUTA VIEJA (v1): sigue yendo al monolito Django.
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto del tráfico (HTML, admin, etc.) también al monolito Django.
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
